# Tilltrend uptime monitor (S3): polls the live app's /health every ~15 min.
# - Stage 1 (no credentials): expects HTTP 200/401 - proves edge + tunnel + app.
# - Stage 2 (TILLTREND_HEALTH_AUTH secret, if set): authenticated /health must be
#   HTTP 200 with "status": "ok"; the response body is never printed (public logs).
# - Stage 3, once a day in the 14:00Z hour (tilltrend D-264): the SAME body must
#   report every warehouse fresh for its own night and the scheduler on, and
#   (D-265) at least one warehouse observed by a thread that checked within 3 h,
#   and (D-268) the host must not be waiting on a reboot.
#   Counts only; shop and package names stay out of this public log. Test it any time with:
#     gh workflow run uptime -f freshness=now
# - Failure of any run emails the repo owner (default GitHub Actions notifications)
#   = the S3 downtime alert. Test the alert path with:
#     gh workflow run uptime -f simulate=fail
# - Heads-up: GitHub disables cron workflows after ~60 days without repo activity;
#   routine site publishes keep this alive.
# - CADENCE (tilltrend D-257): the */15 schedule below is NOT what runs this every
#   15 min. GitHub thinned it to about 7 runs a day from 2026-08-26. A Cloudflare
#   Worker (tilltrend repo, app/deploy/uptime-trigger) dispatches it at :07 :22 :37
#   :52. The schedule stays as the slow backstop, and its runs also check that the
#   Worker is still dispatching (last step), so a dead trigger emails as a failure,
#   once two differently-shaped readings of the run list agree (D-266).
name: uptime

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      simulate:
        description: "Set to 'fail' to test the failure alert"
        required: false
        default: ""
      freshness:
        description: "Set to 'now' to run the daily freshness and pending-reboot assertions outside their 14:00Z window"
        required: false
        default: ""

permissions:
  actions: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Simulated failure (alert test)
        if: ${{ inputs.simulate == 'fail' }}
        run: |
          echo "Simulated failure requested - testing the alert path."
          exit 1

      - name: Edge + app liveness (no credentials)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 5 --retry-all-errors \
            --connect-timeout 10 --max-time 30 https://app.tilltrend.app/health)
          echo "GET /health (unauthenticated) -> HTTP $code"
          case "$code" in
            200|401) echo "edge + tunnel + app are up" ;;
            *) echo "::error::app.tilltrend.app/health returned HTTP $code"; exit 1 ;;
          esac

      - name: Deep health (authenticated, payload never logged)
        env:
          AUTH: ${{ secrets.TILLTREND_HEALTH_AUTH }}
          FRESHNESS: ${{ inputs.freshness }}
        run: |
          if [ -z "$AUTH" ]; then
            echo "no TILLTREND_HEALTH_AUTH secret configured - skipping deep check"
            exit 0
          fi
          body=$(curl -sf -u "$AUTH" --retry 3 --retry-delay 5 --retry-all-errors \
            --connect-timeout 10 --max-time 30 https://app.tilltrend.app/health) || {
            echo "::error::authenticated /health request failed"
            exit 1
          }
          if printf '%s' "$body" | grep -q '"status": "ok"'; then
            echo 'deep health: "status": "ok"'
          else
            echo "::error::/health responded but status is not ok (payload withheld from public log)"
            exit 1
          fi

          # WAREHOUSE FRESHNESS (tilltrend D-264). The body just fetched already
          # carries the refresh block (D-263), so this costs no request and no new
          # credential. A stale store does NOT degrade "status" by design, so it can
          # only be seen by reading refresh.stale.
          #
          # WHY IT LIVES IN THE LIVENESS WORKFLOW RATHER THAN A DAILY ONE OF ITS OWN.
          # A standalone daily cron is the exact mechanism D-257 measured as
          # unreliable here (GitHub thinned */15 to about 7 runs a day), and a watcher
          # that silently does not run is the D-262 failure all over again. This step
          # runs on every Worker dispatch, so its absence is already alarmed by the
          # trigger-freshness step below.
          #
          # IT ONLY ACTS ONCE A DAY. A failed night is not retried (nightly.is_due
          # returns False once an attempt is recorded), so a stale store stays stale
          # until the next night: acting on every run would mean about 96 emails for
          # one miss. 14:00Z is at least six hours after the 03:00-local night of a US
          # Eastern store. It is safe for store zones from UTC-8 eastward; a store
          # further west could be flagged before its own hourly tick reaches it.
          if [ "$FRESHNESS" = "now" ] || { [ "$(date -u +%H)" = "14" ] && [ "$(date -u +%M)" -lt 15 ]; }; then
            # PENDING REBOOT (tilltrend D-268), the one HOST fact /health carries.
            # A kernel update takes effect only on a reboot and nothing applies it
            # unattended, so on 2026-09-24 four kernels had queued since 2026-09-10
            # or earlier while every check here stayed green. It FAILS the run, one
            # email a day in this window, rather than warning, on the founder's
            # call: a warning is a line nobody reads, which is how the flag went
            # unseen. Read first, failed last, so a stale store and a pending
            # reboot both show on the same day. Package names stay in
            # host.packages on /health.
            host_fail=""
            if ! printf '%s' "$body" | jq -e 'has("host")' >/dev/null 2>&1; then
              echo "::notice::/health carries no host block - reboot flag not checked (code older than D-268?)"
            else
              # tostring, never `// "unknown"`: jq's alternative operator treats
              # false as missing, so "nothing pending" would read as unknown.
              reboot=$(printf '%s' "$body" | jq -r '.host.reboot_required | tostring')
              echo "host: reboot required $reboot"
              case "$reboot" in
                false) ;;
                true)
                  echo "::error::the host has installed updates that take effect only on a reboot; reboot at a convenient moment (tilltrend app/docs/deploy-cloud.md, Day-2 ops). Package names are in host.packages on /health and are withheld from this public log"
                  host_fail=1 ;;
                *)
                  echo "::error::the host block could not read the reboot flag (reboot_required is $reboot), so a pending reboot would go unseen; the reason is in host.error on /health"
                  host_fail=1 ;;
              esac
            fi
            if ! printf '%s' "$body" | jq -e 'has("refresh")' >/dev/null 2>&1; then
              echo "::notice::/health carries no refresh block - freshness not checked (code older than D-263?)"
            else
              # WHAT "0 STALE" CANNOT SAY ON ITS OWN (tilltrend D-265). `scheduler` is
              # only the env switch, so "on" is not a live thread. `stale` is empty
              # when nothing was observed at all, which D-263 said must never read as
              # healthy. `checked_at` is the one field that moves only while the thread
              # ticks (hourly), so a hung or dead scheduler shows here the same day,
              # where staleness would wait for the next night and an empty
              # observation set would never show. The warehouse total is asserted
              # and never printed: it is a count of installed stores.
              stale=$(printf '%s' "$body" | jq -r '(.refresh.stale // []) | length')
              sched=$(printf '%s' "$body" | jq -r '.refresh.scheduler // "unknown"')
              seen=$(printf '%s' "$body" | jq -r '.refresh.warehouses // 0')
              checked=$(printf '%s' "$body" | jq -r '.refresh.checked_at // empty')
              age_min=""
              if [ -n "$checked" ] && checked_s=$(date -u -d "$checked" +%s 2>/dev/null); then
                age_min=$(( ($(date -u +%s) - checked_s) / 60 ))
              fi
              echo "warehouse freshness: $stale past their own night, scheduler $sched, last check ${age_min:-unknown} min ago"
              if [ "$sched" != "on" ]; then
                echo "::error::the nightly scheduler reports '$sched', so no store will refresh tonight"
                exit 1
              fi
              if ! [ "$seen" -gt 0 ] 2>/dev/null; then
                echo "::error::the scheduler has observed no warehouse since the app started, so '0 past their own night' checked nothing"
                exit 1
              fi
              if [ -z "$age_min" ]; then
                echo "::error::refresh.checked_at is missing or unreadable, so nothing shows the scheduler thread is ticking"
                exit 1
              fi
              if [ "$age_min" -gt 180 ]; then
                echo "::error::the scheduler's newest observation is $age_min min old; it checks hourly, so its thread has stopped or hung"
                exit 1
              fi
              if [ "$stale" != "0" ]; then
                echo "::error::$stale warehouse(s) missed their own night; the shop names are in refresh.stale on /health and are withheld from this public log"
                exit 1
              fi
            fi
            if [ -n "$host_fail" ]; then
              exit 1
            fi
          fi

      - name: Trigger freshness (scheduled runs only)
        if: ${{ github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_AGE_MIN: "60"
        # TWO READINGS MUST AGREE BEFORE THIS EMAILS (tilltrend D-266). On
        # 2026-09-24T12:15:42Z this query answered 2026-07-04T09:03:23Z, the newest
        # dispatched run that existed BEFORE the Worker started on 2026-09-16, as if
        # it read a view eight days old; the Worker had dispatched 8 min earlier.
        # The same query was right on the 54 other scheduled runs since 2026-09-16
        # and on every re-read since, so the cause is GitHub's and unproven. A
        # stale first reading is therefore checked 20 s later by a query of a
        # different shape: every run CREATED inside the limit, with no event
        # filter, the dispatched ones picked out here. Only when both say stale
        # does the step fail; when they disagree it passes with a warning
        # annotation, so the glitch stays countable without an email. The first
        # reading is left as it was on purpose: a first reading that could not
        # fail this way would leave nothing to count.
        run: |
          newest=$(gh run list -R "$GITHUB_REPOSITORY" --workflow uptime.yml \
            --event workflow_dispatch --limit 1 --json createdAt --jq '.[0].createdAt // empty')
          age_min=""
          if [ -n "$newest" ]; then
            age_min=$(( ($(date -u +%s) - $(date -u -d "$newest" +%s)) / 60 ))
            echo "newest dispatched run: $newest ($age_min min ago, limit $MAX_AGE_MIN)"
            if [ "$age_min" -le "$MAX_AGE_MIN" ]; then
              exit 0
            fi
          else
            echo "newest dispatched run: none returned"
          fi
          sleep 20
          since=$(date -u -d "-$MAX_AGE_MIN min" +%Y-%m-%dT%H:%M:%SZ)
          recent=$(gh run list -R "$GITHUB_REPOSITORY" --workflow uptime.yml \
            --created ">=$since" --limit 50 --json createdAt,event \
            --jq 'map(select(.event == "workflow_dispatch") | .createdAt) | max // empty')
          if [ -n "$recent" ]; then
            recent_min=$(( ($(date -u +%s) - $(date -u -d "$recent" +%s)) / 60 ))
            echo "second reading, runs created since $since: newest $recent ($recent_min min ago)"
            if [ "$recent_min" -le "$MAX_AGE_MIN" ]; then
              echo "::warning::the two readings disagree: the newest-first list said ${newest:-none}, but a dispatched run was created $recent_min min ago, so the first reading is what failed, not the trigger (tilltrend D-266)"
              exit 0
            fi
          else
            echo "second reading, runs created since $since: none"
          fi
          if [ -z "$newest" ]; then
            echo "::error::no dispatched uptime run exists: the Cloudflare trigger has never run"
            exit 1
          fi
          echo "::error::no dispatched run for $age_min min, and none created since $since: the Cloudflare trigger has stopped (expired token, deleted Worker?), so outage detection is back to GitHub's schedule"
          exit 1
