# Tilltrend uptime monitor (S3): polls the live app's /health every ~15 min.
# - Stage 1 (no credentials): expects HTTP 200/401 - proves edge + tunnel + app.
# - Stage 2 (TILLTREND_HEALTH_AUTH secret, if set): authenticated /health must be
#   HTTP 200 with "status": "ok"; the response body is never printed (public logs).
# - Stage 3, once a day in the 14:00Z hour (tilltrend D-264): the SAME body must
#   report every warehouse fresh for its own night and the scheduler on. Counts
#   only; shop names stay out of this public log. Test it any time with:
#     gh workflow run uptime -f freshness=now
# - Failure of any run emails the repo owner (default GitHub Actions notifications)
#   = the S3 downtime alert. Test the alert path with:
#     gh workflow run uptime -f simulate=fail
# - Heads-up: GitHub disables cron workflows after ~60 days without repo activity;
#   routine site publishes keep this alive.
# - CADENCE (tilltrend D-257): the */15 schedule below is NOT what runs this every
#   15 min. GitHub thinned it to about 7 runs a day from 2026-08-26. A Cloudflare
#   Worker (tilltrend repo, app/deploy/uptime-trigger) dispatches it at :07 :22 :37
#   :52. The schedule stays as the slow backstop, and its runs also check that the
#   Worker is still dispatching (last step), so a dead trigger emails as a failure.
name: uptime

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      simulate:
        description: "Set to 'fail' to test the failure alert"
        required: false
        default: ""
      freshness:
        description: "Set to 'now' to run the daily warehouse-freshness assertion outside its 14:00Z window"
        required: false
        default: ""

permissions:
  actions: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Simulated failure (alert test)
        if: ${{ inputs.simulate == 'fail' }}
        run: |
          echo "Simulated failure requested - testing the alert path."
          exit 1

      - name: Edge + app liveness (no credentials)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 5 --retry-all-errors \
            --connect-timeout 10 --max-time 30 https://app.tilltrend.app/health)
          echo "GET /health (unauthenticated) -> HTTP $code"
          case "$code" in
            200|401) echo "edge + tunnel + app are up" ;;
            *) echo "::error::app.tilltrend.app/health returned HTTP $code"; exit 1 ;;
          esac

      - name: Deep health (authenticated, payload never logged)
        env:
          AUTH: ${{ secrets.TILLTREND_HEALTH_AUTH }}
          FRESHNESS: ${{ inputs.freshness }}
        run: |
          if [ -z "$AUTH" ]; then
            echo "no TILLTREND_HEALTH_AUTH secret configured - skipping deep check"
            exit 0
          fi
          body=$(curl -sf -u "$AUTH" --retry 3 --retry-delay 5 --retry-all-errors \
            --connect-timeout 10 --max-time 30 https://app.tilltrend.app/health) || {
            echo "::error::authenticated /health request failed"
            exit 1
          }
          if printf '%s' "$body" | grep -q '"status": "ok"'; then
            echo 'deep health: "status": "ok"'
          else
            echo "::error::/health responded but status is not ok (payload withheld from public log)"
            exit 1
          fi

          # WAREHOUSE FRESHNESS (tilltrend D-264). The body just fetched already
          # carries the refresh block (D-263), so this costs no request and no new
          # credential. A stale store does NOT degrade "status" by design, so it can
          # only be seen by reading refresh.stale.
          #
          # WHY IT LIVES IN THE LIVENESS WORKFLOW RATHER THAN A DAILY ONE OF ITS OWN.
          # A standalone daily cron is the exact mechanism D-257 measured as
          # unreliable here (GitHub thinned */15 to about 7 runs a day), and a watcher
          # that silently does not run is the D-262 failure all over again. This step
          # runs on every Worker dispatch, so its absence is already alarmed by the
          # trigger-freshness step below.
          #
          # IT ONLY ACTS ONCE A DAY. A failed night is not retried (nightly.is_due
          # returns False once an attempt is recorded), so a stale store stays stale
          # until the next night: acting on every run would mean about 96 emails for
          # one miss. 14:00Z is at least six hours after the 03:00-local night of a US
          # Eastern store. It is safe for store zones from UTC-8 eastward; a store
          # further west could be flagged before its own hourly tick reaches it.
          if [ "$FRESHNESS" = "now" ] || { [ "$(date -u +%H)" = "14" ] && [ "$(date -u +%M)" -lt 15 ]; }; then
            if ! printf '%s' "$body" | jq -e 'has("refresh")' >/dev/null 2>&1; then
              echo "::notice::/health carries no refresh block - freshness not checked (code older than D-263?)"
            else
              stale=$(printf '%s' "$body" | jq -r '(.refresh.stale // []) | length')
              sched=$(printf '%s' "$body" | jq -r '.refresh.scheduler // "unknown"')
              echo "warehouse freshness: $stale past their own night, scheduler $sched"
              if [ "$sched" != "on" ]; then
                echo "::error::the nightly scheduler reports '$sched', so no store will refresh tonight"
                exit 1
              fi
              if [ "$stale" != "0" ]; then
                echo "::error::$stale warehouse(s) missed their own night; the shop names are in refresh.stale on /health and are withheld from this public log"
                exit 1
              fi
            fi
          fi

      - name: Trigger freshness (scheduled runs only)
        if: ${{ github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_AGE_MIN: "60"
        run: |
          newest=$(gh run list -R "$GITHUB_REPOSITORY" --workflow uptime.yml \
            --event workflow_dispatch --limit 1 --json createdAt --jq '.[0].createdAt // empty')
          if [ -z "$newest" ]; then
            echo "::error::no dispatched uptime run exists: the Cloudflare trigger has never run"
            exit 1
          fi
          age_min=$(( ($(date -u +%s) - $(date -u -d "$newest" +%s)) / 60 ))
          echo "newest dispatched run: $newest ($age_min min ago, limit $MAX_AGE_MIN)"
          if [ "$age_min" -gt "$MAX_AGE_MIN" ]; then
            echo "::error::no dispatched run for $age_min min: the Cloudflare trigger has stopped (expired token, deleted Worker?), so outage detection is back to GitHub's schedule"
            exit 1
          fi
